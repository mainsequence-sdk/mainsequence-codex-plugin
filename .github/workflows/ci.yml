name: Codex plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm install --global npm@11.6.2
      # `npm ci --ignore-scripts` while the pinned devtools is on the registry. While a pin is
      # not published yet, the script builds it from the devtools repository at its release
      # tag and checks the archive against the lockfile integrity.
      - run: node scripts/install-devtools.cjs
        env:
          # Before 0.3.14 is published, verify the identical archive from this upstream fix.
          DEVTOOLS_SOURCE_REF: codex/linux-session-errors
      - run: npm run release:check
