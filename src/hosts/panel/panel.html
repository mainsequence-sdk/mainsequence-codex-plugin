<main class="shell">
<header class="header">
<div class="row between"><div class="row brand"><span id="brand-mark" class="brand-mark" aria-hidden="true"></span><h1>MainSequence</h1><span id="plugin-version" class="version"></span><span id="plugin-release" class="row release" aria-live="polite"></span></div></div>
<div class="row account-row"><span id="account" class="account-name">Connecting…</span><select id="environment" aria-label="Environment" disabled><option value="">Choose environment</option></select><div class="row utility"><button id="activity-tab" class="plain muted" aria-label="Activity">Activity</button><button id="settings-tab" class="plain muted" aria-label="Settings">Settings</button></div></div>
<p id="account-issue" role="status" class="muted"></p>
<p id="login-notice" role="status"></p>
<div id="plugin-help" class="review plugin-help" role="status" hidden></div>
<nav role="tablist" aria-label="MainSequence"><button id="home-tab" role="tab">Home</button><button id="code-tab" role="tab">Code</button><button id="releases-tab" role="tab">Releases</button><button id="projects-tab" role="tab">Projects</button><button id="agents-tab" role="tab" aria-selected="true">Agents</button><button id="tools-tab" role="tab">Tools</button></nav>
</header>
<section class="content" id="directory" role="tabpanel" aria-labelledby="agents-tab">
<div id="confirmation" role="region" aria-label="Review action"></div>
<div id="list-toolbar" class="toolbar"><form id="search-form" class="row grow"><input id="search" type="search" aria-label="Search agents" placeholder="Search agents" maxlength="300" disabled><button id="search-button" class="plain" disabled>Search</button></form><div id="code-filters" class="row" hidden><button id="code-all" class="plain" type="button">All</button><button id="code-local" class="plain" type="button">Local</button></div><button id="refresh" class="plain muted" disabled>Refresh</button></div>
<p id="notice" class="notice" role="status" aria-live="polite">Loading account status…</p><div id="results"></div>
<div id="pager" class="pager" hidden><button id="previous">Previous</button><small id="page"></small><button id="next">Next</button></div>
</section>
<details id="deliveries" hidden><summary>Messages and recovery</summary><p class="caption">Recover the saved request after Stop. A saved reply is returned without another send.</p><button id="refresh-deliveries" class="plain muted">Refresh messages</button><div id="delivery-results"></div></details>
<footer id="footer">Shared MainSequence session</footer>
<div id="delivery-notice" role="status" aria-live="polite" class="muted"></div>
<section id="composer" class="composer" hidden aria-label="Selected MainSequence agent">
<div class="row between"><div class="grow"><div class="selected-label">Talking to</div><h3 id="recipient"></h3></div><button id="switch-agent" class="plain muted">Switch agent</button><button id="close-composer" class="plain muted">End</button></div>
<label id="response-kind-field" class="row" hidden>Response <select id="response-kind" aria-label="Agent response mode"></select></label>
<textarea id="message" aria-label="Message to selected agent" maxlength="64000" placeholder="Message this agent…"></textarea>
<div class="row between"><small>Replies stay in this Codex chat</small><div class="row"><button id="draft-message" class="plain">Draft</button><button id="send-message" class="primary">Send in Codex</button></div></div>
</section>
</main>
<script type="module">
const BUILD = /* MAINSEQUENCE_PANEL_BUILD */ null;
const $ = id => document.getElementById(id), pending = new Map();
const sections = ['home', 'code', 'releases', 'projects', 'agents', 'tools', 'activity', 'settings'];
let preparationGeneration=0, recipientKinds=[];
let recipient = null, draftRequest = null, messageBusy = false, deliveryGeneration = 0, savedRequests = [];
let sequence = 0, generation = 0, connected = false, busy = false, snapshot = null, catalog = 'agents', offset = 0, currentPage = null, addingTools = false;
const assetCache = new Map(), toolCache = new Map(), activity = [];
// Agent icons change in Command Center without any event reaching the panel. While the Agents list or an
// agent's details stay on screen, the shown icons are re-read once a minute (the shared transport keeps a
// directory read for 30 s, so this is a fresh read without invalidating other panels' caches) and only a
// changed icon is redrawn, in place. The timer ends with the screen and pauses after 240 re-checks.
const ICON_RECHECK_MS = 60000, ICON_RECHECK_LIMIT = 240, drawnIcons = new Map();
let iconWatch = null, iconChecks = 0;
// The running version is always in the header. The server compares it with the published marketplace catalog and,
// after the person confirms, updates through Codex's own plugin commands; the new version loads in a new chat.
const UPDATE_COMMANDS = ['codex plugin marketplace upgrade mainsequence', 'codex plugin add mainsequence@mainsequence'];
let pluginState = null, pluginBusy = '';

// stays open a timer redraws the header at the warning and at the end; the next request then refuses the old view.

function loginWhen(at, now) {

  return (named || 'on ' + date.getDate() + ' ' + MONTHS[date.getMonth()]) + ' at ' + two(date.getHours()) + ':' + two(date.getMinutes());
}
function loginNotice(account, now) { const at = Date.parse(account?.sessionEndsAt); return Number.isFinite(at) ? { kind: at <= now ? 'ended' : at - now <= LOGIN_WARN_MS ? 'soon' : 'active', at, when: loginWhen(at, now) } : null; }
function renderAccount(state) {

  $('login-notice').textContent = ended ? 'MainSequence session ended ' + notice.when + ' — sign in again (/ms login), then refresh.' : soon ? 'MainSequence session ends ' + notice.when + ' — sign in again (/ms login)' : '';
  const next = notice && !ended ? (soon ? notice.at : notice.at - LOGIN_WARN_MS) - now : 0;

  clearTimeout(iconWatch);
  iconWatch = setTimeout(async () => {
    if (!connected || run !== generation || iconChecks >= ICON_RECHECK_LIMIT) return;
    iconChecks++;
    try {
      const current = await load();
      if (run !== generation) return;
      for (const { uid, icon: next } of current) {
        if (JSON.stringify(next ?? null) === JSON.stringify(assetCache.get(uid) ?? null)) continue;
        if (next) assetCache.set(uid, next); else assetCache.delete(uid);

  }, ICON_RECHECK_MS);
}
const environmentKey = state => state?.account?.checked ? 'mainsequence.environment.' + JSON.stringify([state.account.backend,state.account.username]) : null;

}
function styles(context = {}) {

}

function group(cls, ...children) { const e = node('div', undefined, cls); e.append(...children.filter(Boolean)); return e; }

function empty(title, detail) { return group('empty', node('h2', title), caption(detail)); }

function errorText(error) { return [error.result && error.code ? error.code + ': ' + error.message : error.message, error.effects?.message, error.result ? JSON.stringify(error.result.structuredContent || error.result.content || error.result, null, 2) : ''].filter(Boolean).join('\n'); }
function failure(error) { $('notice').textContent = errorText(error); if (['CONTEXT_CHANGED', 'AUTH_REJECTED', 'NOT_AUTHENTICATED'].includes(error.code)) { snapshot = null; workspaceContext=null;operationCache=[];folderBranch=null;releaseMine=false;clearComposer(); ++deliveryGeneration; savedRequests = []; assetCache.clear(); $('deliveries').hidden = true; $('delivery-results').replaceChildren(); $('environment').value = ''; clearResults(); accountIndicator('Session needs refreshing','error'); } }
async function call(name, args = {}) { const output = await rpc('tools/call', { name, arguments: args }); const data = output.structuredContent || JSON.parse(output.content?.find(c => c.type === 'text')?.text || '{}'); if (output.isError || data.error) throw Object.assign(new Error(data.error?.message || 'MainSequence could not complete this action.'), { code: data.error?.code, result: data.result, effects: data.effects }); if (!BUILD || data.build?.panelId !== BUILD.panelId) throw Object.assign(new Error('The panel and server versions differ. Reopen MainSequence from its newest app card.'), { code: 'CONTEXT_CHANGED' }); return data; }
function renderPlugin() {
  const p = pluginState || {}, box = $('plugin-release');
  $('plugin-version').textContent = BUILD?.version ? 'v' + BUILD.version : '';
  box.replaceChildren(pluginBusy === 'update' ? node('span', 'Updating to ' + p.latest + '…', 'muted') : pluginBusy === 'check' ? node('span', 'Checking for updates…', 'muted')

function nativeRequestText(request) {
  const action = request.state === 'delivered' ? 'Show the saved reply' : ['preparing', 'sending'].includes(request.state) ? 'Wait for the reply' : 'Deliver the saved message';
  return action + ' for my MainSequence conversation with ' + JSON.stringify(request.agentName) + '.\nSaved request: ' + request.requestId + '.\nUse this saved request; do not create or resend a message. Keep the agent’s reply in this Codex chat.';
}

async function submitRequest(request, send) {
  await call('mainsequence_submission', { requestId: request.requestId, outcome: 'attempted' });
  try {
    const output = await rpc('ui/message', { role: 'user', content: [{ type: 'text', text: nativeRequestText(request) }], _meta: { 'openai/message': { target: 'active', send } } });
    if (output?.isError) throw new Error('Codex could not accept this message.');
    await call('mainsequence_submission', { requestId: request.requestId, outcome: 'acknowledged' });
    $('delivery-notice').textContent = send ? 'Queued in Codex. This is not yet a delivery receipt. Recover this saved request if interrupted.' : 'Drafted in Codex. Submit the native draft to deliver this saved request.';
  } catch (error) {
    await call('mainsequence_submission', { requestId: request.requestId, outcome: 'unknown' }).catch(() => { });
    $('delivery-notice').textContent = 'Codex’s acknowledgement is unknown. Your request is saved. Use Messages and recovery; do not send it again.';
  }
}
async function sendMessage(send) {
  if (messageBusy || !recipient || !$('message').value.trim()) return;
  const selected = { ...recipient }, message = $('message').value, run = generation;
  messageBusy = true; controls(); $('delivery-notice').textContent = 'Saving your message…';
  if (!draftRequest || draftRequest.message !== message || draftRequest.agentUid !== selected.agentUid || draftRequest.environmentUid !== selected.environmentUid || draftRequest.responseKind !== selected.responseKind || draftRequest.taskRequestId !== selected.taskRequestId) draftRequest = { ...selected, message, requestId: crypto.randomUUID() };
  const draft = { ...draftRequest }; delete draft.name;
  try {
    const { request } = await call('mainsequence_stage_message', draft);
    if (run !== generation || recipient?.agentUid !== selected.agentUid) { $('delivery-notice').textContent = 'The selection changed. Your message is saved but was not submitted. Review it in Messages and recovery.'; return; }
    draftRequest.requestId = request.requestId;
    if (['failed', 'uncertain', 'expired', 'cancelled'].includes(request.state)) { $('delivery-notice').textContent = request.reason || request.state; return; }
    await submitRequest(request, send);
  } catch (error) { $('delivery-notice').textContent = error.message; }
  finally { messageBusy = false; controls(); await loadDeliveries(); }
}
async function loadDeliveries() {
  if (!snapshot?.messagingAvailable) return;
  const run = ++deliveryGeneration;
  try {
    const { requests } = await call('mainsequence_agent_status', { action: 'list' });
    if (run !== deliveryGeneration) return;
    savedRequests = requests; $('deliveries').hidden = requests.length === 0; $('delivery-results').replaceChildren();
    for (const request of [...requests].reverse()) {
      const card = node('article', undefined, 'item');
      const deliveryState = request.task ? stateLabel(request) : { pending: 'Waiting for Codex', preparing: 'Preparing agent', sending: 'Waiting for agent reply', delivered: 'Reply saved', failed: 'Could not send', uncertain: 'Delivery unknown — resend blocked', cancelled: 'Cancelled', expired: 'Expired' }[request.state] || request.state;
      const environment = snapshot.environments.find(e => e.uid === request.environmentUid)?.name || request.environmentUid;
      card.append(node('h3', request.agentName), node('p', [environment, deliveryState, request.createdAt ? new Date(request.createdAt).toLocaleString() : ''].filter(Boolean).join(' · '), 'caption'), details('Message', node('p', request.message)));
      if (request.reason) card.append(node('p', request.reason, 'muted'));
      if (request.receipt) card.append(node('p', request.agentName + ': ' + request.receipt.message, 'receipt'));
      const deliveryDetails = node('details'); deliveryDetails.append(node('summary', 'Delivery details'), node('small', 'Request ' + request.requestId + ' · Agent dispatches: ' + request.sendAttempts)); card.append(deliveryDetails);
      if (['pending', 'preparing', 'sending', 'delivered'].includes(request.state) || (request.state === 'failed' && request.sendAttempts === 0)) {
        const recover = node('button', request.state === 'delivered' ? 'Show reply in Codex' : 'Recover in Codex');
        recover.onclick = async () => {
          if (messageBusy) return; messageBusy = true; recover.disabled = true; controls();
          try { await submitRequest(request, true); } catch (error) { $('delivery-notice').textContent = error.message; }
          finally { messageBusy = false; controls(); await loadDeliveries(); }
        }; card.append(recover);
      }
      if (request.state === 'pending') {

        cancel.onclick = async () => { cancel.disabled = true; try { await call('mainsequence_agent_request', { action: 'cancel', requestId: request.requestId }); await loadDeliveries(); } catch (error) { $('delivery-notice').textContent = error.message; cancel.disabled = false; } }; card.append(cancel);
      }

    if (!requests.length) $('delivery-results').append(node('p', 'No saved messages in this chat.', 'muted'));
  } catch (error) { if (run === deliveryGeneration) $('delivery-notice').textContent = error.message; }
}
