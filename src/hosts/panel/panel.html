</section>

function nativeRequestText(request) {
  const action = request.state === 'delivered' ? 'Show the saved reply' : ['preparing', 'sending'].includes(request.state) ? 'Wait for the reply' : 'Deliver the saved message';
  return action + ' for my MainSequence conversation with ' + JSON.stringify(request.agentName) + '.\nSaved request: ' + request.requestId + '.\nUse this saved request; do not create or resend a message. Keep the agent’s reply in this Codex chat.';
}

async function submitRequest(request, send) {
  await call('mainsequence_submission', { requestId: request.requestId, outcome: 'attempted' });
  try {
    const output = await rpc('ui/message', { role: 'user', content: [{ type: 'text', text: nativeRequestText(request) }], _meta: { 'openai/message': { target: 'active', send } } });
    if (output?.isError) throw new Error('Codex could not accept this message.');
    await call('mainsequence_submission', { requestId: request.requestId, outcome: 'acknowledged' });
    $('delivery-notice').textContent = send ? 'Queued in Codex. This is not yet a delivery receipt. Recover this saved request if interrupted.' : 'Drafted in Codex. Submit the native draft to deliver this saved request.';
  } catch (error) {
    await call('mainsequence_submission', { requestId: request.requestId, outcome: 'unknown' }).catch(() => { });
    $('delivery-notice').textContent = 'Codex’s acknowledgement is unknown. Your request is saved. Use Messages and recovery; do not send it again.';
  }
}
async function sendMessage(send) {
  if (messageBusy || !recipient || !$('message').value.trim()) return;
  const selected = { ...recipient }, message = $('message').value, run = generation;
  messageBusy = true; controls(); $('delivery-notice').textContent = 'Saving your message…';
  if (!draftRequest || draftRequest.message !== message || draftRequest.agentUid !== selected.agentUid || draftRequest.environmentUid !== selected.environmentUid || draftRequest.responseKind !== selected.responseKind || draftRequest.taskRequestId !== selected.taskRequestId) draftRequest = { ...selected, message, requestId: crypto.randomUUID() };
  const draft = { ...draftRequest }; delete draft.name;
  try {
    const { request } = await call('mainsequence_stage_message', draft);
    if (run !== generation || recipient?.agentUid !== selected.agentUid) { $('delivery-notice').textContent = 'The selection changed. Your message is saved but was not submitted. Review it in Messages and recovery.'; return; }
    draftRequest.requestId = request.requestId;
    if (['failed', 'uncertain', 'expired', 'cancelled'].includes(request.state)) { $('delivery-notice').textContent = request.reason || request.state; return; }
    await submitRequest(request, send);
  } catch (error) { $('delivery-notice').textContent = error.message; }
  finally { messageBusy = false; controls(); await loadDeliveries(); }
}
async function loadDeliveries() {
  if (!snapshot?.messagingAvailable) return;
  const run = ++deliveryGeneration;
  try {
    const { requests } = await call('mainsequence_agent_status', { action: 'list' });
    if (run !== deliveryGeneration) return;
    savedRequests = requests; $('deliveries').hidden = requests.length === 0; $('delivery-results').replaceChildren();
    for (const request of [...requests].reverse()) {
      const card = node('article', undefined, 'item');
      const deliveryState = request.task ? stateLabel(request) : { pending: 'Waiting for Codex', preparing: 'Preparing agent', sending: 'Waiting for agent reply', delivered: 'Reply saved', failed: 'Could not send', uncertain: 'Delivery unknown — resend blocked', cancelled: 'Cancelled', expired: 'Expired' }[request.state] || request.state;
      const environment = snapshot.environments.find(e => e.uid === request.environmentUid)?.name || request.environmentUid;
      card.append(node('h3', request.agentName), node('p', [environment, deliveryState, request.createdAt ? new Date(request.createdAt).toLocaleString() : ''].filter(Boolean).join(' · '), 'caption'), details('Message', node('p', request.message)));
      if (request.reason) card.append(node('p', request.reason, 'muted'));
      if (request.receipt) card.append(node('p', request.agentName + ': ' + request.receipt.message, 'receipt'));
      const deliveryDetails = node('details'); deliveryDetails.append(node('summary', 'Delivery details'), node('small', 'Request ' + request.requestId + ' · Agent dispatches: ' + request.sendAttempts)); card.append(deliveryDetails);
      if (['pending', 'preparing', 'sending', 'delivered'].includes(request.state) || (request.state === 'failed' && request.sendAttempts === 0)) {
        const recover = node('button', request.state === 'delivered' ? 'Show reply in Codex' : 'Recover in Codex');
        recover.onclick = async () => {
          if (messageBusy) return; messageBusy = true; recover.disabled = true; controls();
          try { await submitRequest(request, true); } catch (error) { $('delivery-notice').textContent = error.message; }
          finally { messageBusy = false; controls(); await loadDeliveries(); }

      if (request.state === 'pending') {
        const cancel = node('button', 'Cancel unsent message');
        cancel.onclick = async () => { cancel.disabled = true; try { await call('mainsequence_agent_request', { action: 'cancel', requestId: request.requestId }); await loadDeliveries(); } catch (error) { $('delivery-notice').textContent = error.message; cancel.disabled = false; } }; card.append(cancel);
      }

    if (!requests.length) $('delivery-results').append(node('p', 'No saved messages in this chat.', 'muted'));

}

addEventListener('message', event => {
